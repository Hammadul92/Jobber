name: Deploy to Droplet

concurrency:
  group: production-deployment
  cancel-in-progress: false

on:
  workflow_run:
    workflows: ["Build & Push Docker Images"]
    types:
      - completed

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: IMAGE_TAG
          command_timeout: 30m
          script: |
            set -e
            cd ~/Contractorz/Jobber
            # Keep the server lock across both the checkout and deployment.
            exec 9>/tmp/jobber-production-deploy.lock
            flock -w 1200 9
            git pull --ff-only origin main
            if [ "$(git rev-parse HEAD)" != "$IMAGE_TAG" ]; then
              echo "Skipping superseded release ${IMAGE_TAG}; main has advanced."
              exit 0
            fi
            bash scripts/deploy.sh
