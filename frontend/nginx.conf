# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name getcontractorz.com www.getcontractorz.com;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name getcontractorz.com www.getcontractorz.com;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;

    # Proxy Django admin
    location /admin/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
    }


    # React owns authentication, questionnaire, session, and account routes.
    location ~ ^/(sign-in|register|forgot-password|reset-password|logout|session-bridge)/?$ {
        try_files $uri /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /user {
        try_files $uri /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location ^~ /user/ {
        try_files $uri /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location ^~ /service-questionnaire/ {
        try_files $uri /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Vite assets used by the React application.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /images/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Django owns public pages and unmatched routes so SEO responses are
    # rendered server-side and unknown URLs return a real HTTP 404.
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
